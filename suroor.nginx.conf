# ==========================================
# SUROOR AI - NGINX REVERSE PROXY CONFIG
# ==========================================

# 1. Frontend Server Block (suroor.cc & www.suroor.cc)
server {
    listen 80;
    server_name suroor.cc www.suroor.cc;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. Backend API & SSE Streaming Server Block (api.suroor.cc)
server {
    listen 80;
    server_name api.suroor.cc;

    client_max_body_size 15M; # Allows avatar uploads up to 10MB+

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        
        # CRITICAL: Headers for Server-Sent Events (SSE) & AI Token Streaming
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        
        # Timeouts set high so long-form AI generations never disconnect
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        send_timeout 300s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}